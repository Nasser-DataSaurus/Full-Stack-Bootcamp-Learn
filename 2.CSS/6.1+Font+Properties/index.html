<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Properties</title>
  <style>
    html{font-size: 30px;}
    body {
      background-color: cornflowerblue;
      color: white;
      font-size: 18px;
    }

    /* Don't change the CSS above, add Your CSS below */
 
    #p-color{color: coral;}
    #Fount-size{font-size: 2em;}
    #Font-Weight{font-weight: 900;}
    #Font-Family{
    font-family: "Caveat", cursive;
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
    }
    #Text-Align{text-align: right;}

  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=JetBrains+Mono:ital@0;1&family=SUSE+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
</head>

<body>
  <h1>Important CSS Properties</h1>
  <p id="p-color">Color</p>
  <p id="Fount-size">Font Size</p>
  <p id="Font-Weight">Font Weight</p>
  <p id="Font-Family">Font Family</p>
  <p id="Text-Align">Text Align</p>

</html>
