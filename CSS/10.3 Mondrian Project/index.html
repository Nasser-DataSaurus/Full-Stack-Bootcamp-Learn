<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body{
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .Contner{
      display: grid;
      grid-template-columns: 320px 198px 153px 50px ;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
      background-color: #000;
      height: 748px;
      width: 748px;
    }
    .redbox{
      background-color: #E72F24;
      order: 1;
    }
    .Whitebox{
      background-color: #F0F1EC;
    }
    .b0{
      grid-column-start:2 ;
      grid-column-end: 5;
      order: 2;
    }
    
    .b1{
      grid-column-start:1;
      grid-column-end: 2;
      grid-row: 2 span;
      order: 3;
    }
    .b2{
      grid-row: 2 span;
      grid-column: 2 span;
      order: 4
    }
    .b3{
      order: 7;
    }
    .b4{
      order: 6;
      grid-row: 2 span;
    }
    .blueBox{
      background-color: #004592;
      order: 5;
      border-bottom: 10px solid #000;
    }
    .YellowBox{
      background-color: #F9D01E;
      order: 8;
    }  
    .BlackBox{
      background-color: #232629;
      order: 9;
    }    

  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="Contner bigBox">
    <div class="redbox"></div>
    <div class="Whitebox b0"></div>
    <div class="Whitebox b1"></div>
    <div class="Whitebox b2"></div>
    <div class="Whitebox b3"></div>
    <div class="Whitebox b4"></div>
    <div class="blueBox"></div>
    <div class="YellowBox"></div>
    <div class="BlackBox"></div>
   </div>
</body>

</html>
